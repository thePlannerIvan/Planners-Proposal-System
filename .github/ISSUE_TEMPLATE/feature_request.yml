name: Feature request
description: 建议可复用的工作流改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的真实工作问题
      description: 请说明当前谁在什么阶段做什么决定，以及为什么困难。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 希望改变的用户行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 示例、测试或其他证据
  - type: checkboxes
    id: scope
    attributes:
      label: 提交前确认
      options:
        - label: 这不是只适用于单个客户的专用内容
          required: true
        - label: 内容不包含客户机密或个人敏感信息
          required: true
